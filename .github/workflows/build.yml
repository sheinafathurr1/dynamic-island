name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish (single exe, needs .NET Desktop Runtime 10)
        run: >
          dotnet publish src/DynamicIsland/DynamicIsland.csproj
          -c Release -r win-x64 -p:SelfContained=false
          -p:PublishSingleFile=true -p:PublishReadyToRun=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: publish/DynamicIsland.exe

      # Launches the real app on the runner's desktop, clicks through it and takes screenshots.
      - name: UI smoke test
        shell: powershell
        run: ./tools/ui-smoke-test.ps1 -Exe publish/DynamicIsland.exe -OutDir screenshots -EmitBase64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
